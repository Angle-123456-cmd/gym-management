# 1. 数据库驱动配置（连接库）
# 指定 MySQL 数据库的 JDBC 驱动类。
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# 2. 数据库连接地址（URL）
# jdbc:mysql:// 是协议；localhost:3306 是主机和端口；gym_management 是数据库名。
# useSSL=false：关闭 SSL 加密（本地开发常见）；characterEncoding=utf8：指定字符集防止乱码；
# serverTimezone=Asia/Shanghai：设置时区，避免时间字段报错。
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai

# 3. 数据库登录用户名
spring.datasource.username=root

# 4. 数据库登录密码
spring.datasource.password=123456

# 5. Hibernate 自动建表策略（DDL 模式）
# none：不执行任何建表/改表操作（表需手动创建）。
# 其他常用值：update（自动更新表结构）、create（每次都重新建表）、validate（校验表结构是否匹配）。
spring.jpa.hibernate.ddl-auto=none

# 6. 打印 SQL 日志
# true 表示在控制台输出 Hibernate 生成的 SQL 语句，方便开发调试。
spring.jpa.show-sql=true

# 7. Hibernate 方言（Dialect）
# 告诉 Hibernate 使用 MySQL 5 的语法风格。如果安装的是 MySQL 8，建议改为 org.hibernate.dialect.MySQL8Dialect。
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect

# 8. Spring MVC 视图解析器（以下两项与 Hibernate 无关，属于 Web 层配置）
# 设置 JSP 文件存放的根目录路径（默认在 webapp 下）
spring.mvc.view.prefix=/WEB-INF/jsp/
# 设置 JSP 文件的后缀名，拼接后形成完整路径，例如控制器返回 "index"，则访问 /WEB-INF/jsp/index.jsp
spring.mvc.view.suffix=.jsp